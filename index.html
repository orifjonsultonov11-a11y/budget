<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Мой бюджет</title>
<style>
:root{
  --bg:#F5F5F3;--card:#FFFFFF;--text:#121212;--muted:#8B8B90;--line:#EBEBEA;--soft:#F1F1EF;
  --pos:#12935A;--neg:#E5484D;--warn:#A86A12;--warnbg:#FFF4DE;--btn:#121212;--btntext:#FFFFFF;--r:20px;
  --grid:#E1E0D9;--axis:#C3C2B7;--ink2:#52514E;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#B5B4AD;
  --inc:#1baf7a;--exp:#2a78d6;
  --h0:#F1F1EF;--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#1c5cab;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0C0D;--card:#171719;--text:#F3F3F3;--muted:#8E8E93;--line:#26262A;--soft:#222225;
  --pos:#3DD68C;--neg:#FF6369;--warn:#F5C451;--warnbg:#2A2310;--btn:#F3F3F3;--btntext:#111111;
  --grid:#2C2C2A;--axis:#383835;--ink2:#C3C2B7;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--other:#5A5955;
  --inc:#199e70;--exp:#3987e5;
  --h0:#222225;--h1:#104281;--h2:#1c5cab;--h3:#2a78d6;--h4:#5598e7;--h5:#9ec5f4;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px calc(110px + env(safe-area-inset-bottom))}
.num,.big,.stat b,.kv b,.r b,.r span,.tamt,.sumrow b,.cc i{font-variant-numeric:tabular-nums}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:10px 4px 2px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:15px;margin:0 4px 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.topbar h1{margin:10px 4px 0}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card.tight{padding:8px 10px}
.label{color:var(--muted);font-size:13px;font-weight:500}
.small{color:var(--muted);font-size:13px;margin:10px 0 0;line-height:1.4}
.mt{margin-top:10px}.mt2{margin-top:16px}
.big{font-size:46px;font-weight:700;letter-spacing:-.035em;margin:2px 0 14px;line-height:1.1}
.big small{font-size:18px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--text);border-radius:6px}
.bar.over i{background:var(--neg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{display:block;font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.long{font-size:13.5px;margin-top:4px}
.hint{font-size:13px;color:var(--muted);margin-top:12px}
.btn{border:0;background:var(--btn);color:var(--btntext);font-weight:600;border-radius:14px;height:52px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{height:42px;padding:0 14px;font-size:15px}
.btn.ghost{background:var(--card);color:var(--text)}
.card .btn.ghost,.sheet .btn.ghost{background:var(--soft)}
.btn.block{width:100%}
.btn.danger{color:var(--neg)}
.link{background:none;border:0;color:var(--muted);font-size:14px;padding:12px 0 0;text-decoration:underline;text-underline-offset:3px}
.icon{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.icon:active{background:var(--soft)}
.icon svg{width:20px;height:20px}
.icon.solid{background:var(--card);color:var(--text)}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:15px;gap:10px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.kv.total span{color:var(--text);font-weight:600}
.warn{background:var(--warnbg)}
.warn .wt{font-weight:600;color:var(--warn);font-size:15px}
.warn .small{color:var(--warn);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:0;background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;font-size:14px;font-weight:600;color:var(--muted);height:36px;border-radius:9px;padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.wrap>.seg{background:var(--line)}
.wrap>.seg button.on{background:var(--card)}
.seg.mini{flex:none}.seg.mini button{width:36px;padding:0;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:12px;font-size:15px}
.card .row:first-of-type{margin-top:6px}
.row small{color:var(--muted);font-size:12px}
.in{border:0;background:var(--soft);border-radius:10px;height:40px;padding:0 12px;font-size:16px;font-weight:600;color:var(--text);width:150px;text-align:right;outline:none;-webkit-appearance:none;appearance:none;min-width:0}
.in.xs{width:70px}
.in.wide{width:100%;text-align:left}
.in[type=date]{width:auto;min-width:140px}
.carry{display:flex;gap:6px;align-items:center}
.carry .in{width:120px}
.navp{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.navp .ttl{text-align:center;flex:1}
.navp .ttl b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.navp .ttl span{font-size:13px;color:var(--muted)}
.navp .icon{width:44px;height:44px;background:var(--card);border-radius:14px;color:var(--text)}
.note{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.ta{width:100%;height:110px;margin-top:10px;border:0;border-radius:12px;background:var(--soft);color:var(--text);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:none}
.filebtn{cursor:pointer}
.confirm{margin-top:14px;padding:14px;border-radius:14px;background:var(--warnbg)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* summary strip */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;padding:12px 4px;margin-bottom:12px;text-align:center}
.sumrow div+div{border-left:1px solid var(--line)}
.sumrow span{display:block;font-size:12px;color:var(--muted)}
.sumrow b{display:block;font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}

/* tx list */
.dgroup{background:var(--card);border-radius:18px;margin-bottom:10px;padding:4px 14px}
.dhead{display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.dnum{font-size:24px;font-weight:700;width:34px}
.dwd{flex:1;font-size:13px;color:var(--muted);line-height:1.2}
.dwd .wdb{display:inline-block;background:var(--soft);color:var(--text);font-weight:600;border-radius:6px;padding:1px 6px;font-size:12px}
.dsum{text-align:right;font-size:13px;font-weight:600;line-height:1.35}
.dsum span{display:block}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.dhead+.tx{border-top:0}
.cic{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none;font-weight:700;color:var(--muted)}
.tmid{flex:1;min-width:0}
.tmid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmid span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tamt{font-weight:600;font-size:15px;white-space:nowrap}
.tx.nl .tamt{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:15px}

/* calendar */
.cal{background:var(--card);border-radius:18px;padding:10px 6px 8px;margin-bottom:12px}
.cwd,.cgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.cwd span{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:6px}
.cc{border:0;background:none;min-height:58px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 3px;gap:1px;min-width:0}
.cc b{font-size:14px;font-weight:600;width:26px;height:24px;line-height:24px;border-radius:50%}
.cc i{font-style:normal;font-size:10px;font-weight:600;line-height:1.25;white-space:nowrap}
.cc i.e{color:var(--text)}
.cc.out{opacity:0;pointer-events:none}
.cc.today b{background:var(--text);color:var(--card)}
.cc.sel{background:var(--soft)}
.cc.wk7 b{color:var(--neg)}

/* months */
.mrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-child{border-top:0}
.mrow .mn{flex:1;font-weight:600}
.mrow .mv{text-align:right;font-size:13px;line-height:1.35;font-weight:600}
.mrow .mv span{display:block}

/* fab */
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--btn);color:var(--btntext);font-size:32px;font-weight:300;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:9;display:grid;place-items:center}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:140px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
.tabbar button.on{color:var(--text)}
.tabbar svg{width:24px;height:24px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20}
.anim .sheet-bg{animation:fade .2s}.anim .sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));z-index:21;max-height:90vh;overflow:auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .stat{background:var(--soft)}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sumline b{font-weight:600}
.missnote{color:var(--warn);font-size:14px;font-weight:600;margin-top:14px}

/* editor */
.ed{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.anim .ed{animation:up .22s cubic-bezier(.2,.8,.2,1)}
.edin{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.edhead{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.edhead .seg{flex:1;background:var(--line)}
.edbody{flex:1;overflow:auto;padding:4px 16px 12px;min-height:0}
.amt{width:100%;border:0;background:var(--card);border-radius:18px;padding:14px 18px;text-align:right;display:block;margin-bottom:10px;border:2px solid transparent}
.amt.on{border-color:var(--text)}
.amt .expr{display:block;font-size:14px;color:var(--muted);min-height:19px;font-variant-numeric:tabular-nums}
.amt b{font-size:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amt b.ph{color:var(--muted);font-weight:600}
.amt em{font-style:normal;color:var(--muted);font-size:16px;margin-left:6px;font-weight:600}
.fbox{background:var(--card);border-radius:18px;padding:0 16px;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.frow:first-child{border-top:0}
.frow>span{width:96px;flex:none;color:var(--muted);font-size:15px}
.frow>b{flex:1;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow>b.ph{color:var(--muted);font-weight:500}
.frow.on>b{color:var(--text)}
.frow input{flex:1;border:0;background:none;outline:none;font-size:16px;text-align:right;min-width:0;padding:0;height:50px}
.frow input[type=date]{-webkit-appearance:none;appearance:none;text-align:right;font-weight:600}
.frow input::placeholder{color:var(--muted)}
.edbtns{display:flex;gap:8px;margin-top:4px}
.edbtns .btn{flex:1}
.panel{background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.ed.typing .panel{display:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{height:52px;border:0;border-radius:12px;background:var(--soft);font-size:22px;font-weight:500}
.keys button.op{background:var(--line);font-size:22px}
.keys button.go{background:var(--btn);color:var(--btntext);font-size:17px;font-weight:600;grid-column:span 2}
.keys button.fn{font-size:16px;font-weight:600}
.cgrid2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:300px;overflow:auto}
.ctile{border:0;background:var(--soft);border-radius:14px;min-height:76px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.ctile.on{outline:2px solid var(--text)}
.ctile .ci{font-size:24px;line-height:1}
.ctile .ci.l{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.ctile .cn{font-size:12px;font-weight:600;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.phead{display:flex;align-items:center;gap:6px;padding:2px 2px 8px;font-weight:600}

/* categories screen */
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.crow:first-child{border-top:0}
.crow.sub{padding-left:28px}
.crow.sub .cic{width:28px;height:28px;font-size:14px;border-radius:9px}
.crow .cnm{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;flex:none;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--pos)}
.sw.on::after{transform:translateX(18px)}
.sw.dis{opacity:.35}
.lhint{display:flex;justify-content:flex-end;font-size:11px;color:var(--muted);padding:0 0 6px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--other);border-radius:0;width:14px;vertical-align:3px}
.legend i.line{height:0;border-top:2px solid;border-radius:0;width:14px;vertical-align:3px}
.donutw{display:flex;justify-content:center;margin:6px 0 4px}
.donutw svg{width:200px;height:200px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-child{border-top:0}
.lrow .dot{width:12px;height:12px;border-radius:4px;flex:none}
.lrow .ln{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lp{color:var(--muted);font-size:13px;width:44px;text-align:right}
.lrow .lv{font-weight:600;font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
.hbar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.headline{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.headline b{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tn span{font-size:12px;color:var(--muted)}
.trow .tv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.trow .tv span{display:block;font-size:12px;font-weight:600}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.hm span{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.hm i{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--text)}
.hm i.dk{color:#fff}
.hm i.out{visibility:hidden}
.hscale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.hscale i{width:14px;height:10px;border-radius:3px;display:inline-block}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-style:normal;color:#fff;font-weight:700}
.dots i.ok{background:var(--pos)}.dots i.ov{background:var(--neg)}.dots i.na{background:var(--line)}
.bigstat{display:flex;gap:18px;margin-top:6px}
.bigstat div b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.bigstat div span{font-size:12px;color:var(--muted)}

.day{display:flex;align-items:center;gap:12px;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer}
.day:first-of-type{border-top:0}
.day .d{width:38px;text-align:center;flex:none}
.day .d b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.day .d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.day .mid{flex:1;font-size:14px;color:var(--muted);min-width:0}
.day .r{text-align:right}
.day .r b{display:block;font-weight:600;font-size:16px}
.day .r span{font-size:13px;font-weight:500}
.day.miss{background:var(--warnbg);border-radius:14px;border-top-color:transparent}
.day.miss + .day{border-top-color:transparent}
.tag{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.03em}
.today-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text);margin-right:6px;vertical-align:middle}
#tip{position:fixed;z-index:50;background:var(--btn);color:var(--btntext);font-size:13px;font-weight:500;padding:7px 10px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .15s;max-width:240px;line-height:1.35;white-space:pre-line}
#tip.show{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--btn);color:var(--btntext);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);gap:14px;text-align:center}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:rot .8s linear infinite}
.searchbar{display:flex;gap:8px;align-items:center;margin:8px 0 12px}
.searchbar input{flex:1;height:44px;border:0;border-radius:12px;background:var(--card);padding:0 14px;font-size:16px;outline:none}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div id="tip"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
